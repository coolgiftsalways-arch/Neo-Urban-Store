  <script>

    /* Create Google dataLayer */
    window.dataLayer = window.dataLayer || [];


    /* Create global gtag() function */
    window.gtag = function () {
      window.dataLayer.push(arguments);
    };


    /* Initialize Google Tag */
    window.gtag("js", new Date());


    /* =====================================================
       GOOGLE ANALYTICS 4
       Measurement ID: G-KGVKTP6JSP
    ====================================================== */

    window.gtag(
      "config",
      "G-KGVKTP6JSP"
    );


    /* =====================================================
       GOOGLE ADS
       Google Ads ID: AW-17947306709
    ====================================================== */

    window.gtag(
      "config",
      "AW-17947306709"
    );


    /* =====================================================
       GOOGLE ADS PURCHASE CONVERSION

       Conversion:
       AW-17947306709/ZU67CML3w_kcENXV-O1C

       IMPORTANT:
       DO NOT fire this automatically here.

       This function should ONLY be called after:
       1. Payment succeeds
       2. Order is created
       3. Ideally backend payment verification succeeds
    ====================================================== */

    window.trackPurchaseConversion = function (
      value = 1,
      transactionId = ""
    ) {

      /* Safety check */
      if (typeof window.gtag !== "function") {
        console.warn("Google gtag is not loaded.");
        return;
      }


      /* Send Google Ads purchase conversion */
      window.gtag("event", "conversion", {

        /* Google Ads Conversion ID + Label */
        send_to:
          "AW-17947306709/ZU67CML3w_kcENXV-O1C",

        /* Actual purchase amount */
        value: Number(value),

        /* Currency */
        currency: "INR",

        /* Unique Order / Payment ID */
        transaction_id: transactionId,

      });


      /* Debug message - you can remove later */
      console.log(
        "Google Ads purchase conversion sent:",
        {
          value: Number(value),
          transactionId: transactionId,
        }
      );
    };

  </script>
