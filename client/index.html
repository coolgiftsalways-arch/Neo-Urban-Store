  <script>
    window.dataLayer = window.dataLayer || [];

    window.gtag = function () {
      window.dataLayer.push(arguments);
    };

    gtag("js", new Date());

    // Google Analytics 4
    gtag("config", "G-KGVKTP6JSP");

    // Google Ads
    gtag("config", "AW-17947306709");

    // =========================================
    // NEW GOOGLE ADS PURCHASE (5)
    // =========================================
    // Conversion label:
    // AW-17947306709/rBlUCMr5qpwdENXV-O1C
    //
    // Call this function ONLY after a
    // successfully confirmed purchase.
    // Never trigger it on page load.
    // =========================================

    window.trackPurchaseConversion = function (
      value,
      transactionId
    ) {
      const amount = Number(value);

      if (
        typeof window.gtag !== "function" ||
        !Number.isFinite(amount) ||
        amount <= 0 ||
        !transactionId
      ) {
        console.warn(
          "Purchase conversion skipped: invalid data."
        );
        return;
      }

      gtag("event", "conversion", {
        send_to:
          "AW-17947306709/rBlUCMr5qpwdENXV-O1C",

        value: amount,

        currency: "INR",

        transaction_id: String(transactionId)
      });

      console.log(
        "Google Ads purchase conversion queued:",
        String(transactionId)
      );
    };
  </script>
